<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SplitBill Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand mb-0 h1">
            💰 SplitBill
        </span>

        <button class="btn btn-light" onclick="logout()">
            Logout
        </button>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 id="welcomeText"></h2>

            <hr>

            <div class="row g-3">

                <div class="col-md-6">

                    <button
                            class="btn btn-primary"
                            data-bs-toggle="modal"
                            data-bs-target="#createGroupModal">

                        Create Group
                    </button>

                </div>

                <div class="col-md-6">

                    <button
                            class="btn btn-success w-100"
                            data-bs-toggle="modal"
                            data-bs-target="#expenseModal">

                        Add Expense

                    </button>

                </div>

                <div class="col-md-6">

                    <button class="btn btn-warning w-100">
                        View Expenses
                    </button>

                </div>

                <div class="col-md-6">

                    <button class="btn btn-info w-100">
                        View Balances
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
<hr>

<h4 class="mt-4">Your Groups</h4>

<div id="groupList" class="list-group mt-3">

</div>
<!-- Create Group Modal -->
<div class="modal fade" id="createGroupModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Create Group</h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input
                        type="text"
                        id="groupName"
                        class="form-control"
                        placeholder="Enter Group Name">

            </div>

            <div class="modal-footer">

                <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>

                <button
                        id="saveGroupBtn"
                        class="btn btn-primary">
                    Create
                </button>

            </div>

        </div>
    </div>
</div>
<!-- Add Expense Modal -->
<div class="modal fade" id="expenseModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">
                <h5>Add Expense</h5>

                <button
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <select
                        id="expenseGroup"
                        class="form-select mb-3">
                </select>

                <input
                        type="text"
                        id="expenseDescription"
                        class="form-control mb-3"
                        placeholder="Description">

                <input
                        type="number"
                        id="expenseAmount"
                        class="form-control mb-3"
                        placeholder="Amount">

                <input
                        type="text"
                        id="paidBy"
                        class="form-control"
                        placeholder="Paid By">

            </div>

            <div class="modal-footer">

                <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>

                <button
                        id="saveExpenseBtn"
                        class="btn btn-success">
                    Save Expense
                </button>

            </div>

        </div>

    </div>

</div>
<!-- Add Member Modal -->
<div class="modal fade" id="addMemberModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Add Member</h5>
                <button class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="selectedGroupId">

                <select id="memberDropdown"
                        class="form-select">
                </select>

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>

                <button id="saveMemberBtn"
                        class="btn btn-primary">
                    Add Member
                </button>

            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
